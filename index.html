<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#e8e3dc;font-family:"PingFang SC",sans-serif}
canvas{display:block}
.ui{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);display:flex;gap:10px}

#load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#8a7d70;letter-spacing:3px}
#ink{position:fixed;z-index:20;background:rgba(255,253,240,.35);border:1.5px dashed rgba(47,99,168,.45);border-radius:3px;outline:none;resize:none;color:#24324f;font-family:"Kaiti SC","STKaiti","Bradley Hand",cursive;padding:0 2px;overflow:hidden;caret-color:#2f63a8}

#note{position:fixed;z-index:20;width:230px;background:#fffdf6;border-radius:6px;padding:10px 12px;box-shadow:0 10px 30px #0003;font-size:12px;color:#6b5a48}

/* liquid-glass folder holding the ins stickers */
.folder{position:fixed;left:0;top:0;width:250px;height:168px;transform-origin:0 0;z-index:11;--mx:50%;--my:30%}
.folder .gl{position:absolute;backdrop-filter:blur(9px) saturate(1.7) brightness(1.06);-webkit-backdrop-filter:blur(9px) saturate(1.7) brightness(1.06);
  border:1px solid rgba(255,255,255,.75);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.95),inset 0 -12px 22px rgba(255,170,205,.18),0 12px 30px rgba(110,50,70,.16)}
.folder .gl::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:radial-gradient(120px 60px at var(--mx) var(--my),rgba(255,255,255,.55),transparent 70%),linear-gradient(115deg,transparent 28%,rgba(255,255,255,.35) 40%,transparent 50%)}
.folder .tab{left:16px;top:6px;width:96px;height:30px;border-radius:14px 14px 0 0;background:linear-gradient(180deg,rgba(255,255,255,.4),rgba(255,214,232,.22));border-bottom:0;
  font:600 11px/26px "PingFang SC";color:#b04a78;text-align:center;letter-spacing:1px}
.folder .back{left:0;right:0;top:30px;bottom:0;border-radius:20px;background:linear-gradient(140deg,rgba(255,255,255,.34),rgba(255,206,226,.16))}
.folder .peek{position:absolute;left:18px;right:18px;top:40px;height:80px;pointer-events:none}

  transition:transform .5s cubic-bezier(.25,1.7,.45,1),opacity .18s}
.folder .pop .stkw{width:104px;height:104px}
.folder.open .pop{opacity:1;transform:translateY(-70px) rotate(var(--r,-6deg)) scale(1)}
.folder .front{left:-2px;right:-2px;bottom:0;height:96px;border-radius:16px 16px 22px 22px;
  background:linear-gradient(180deg,rgba(255,255,255,.5),rgba(255,228,240,.22) 60%,rgba(255,200,225,.3));
  display:flex;align-items:flex-end;justify-content:space-between;padding:0 16px 12px;font:600 11px "PingFang SC";color:#a5486f;letter-spacing:1px;pointer-events:none}
.folder .front b{font:800 22px/1 "Avenir Next","PingFang SC";color:#e0559a;letter-spacing:0}
.folder .front::before{content:"";position:absolute;left:14px;right:14px;top:7px;height:2px;border-radius:2px;background:rgba(255,255,255,.95);box-shadow:0 0 6px #fff}
.folder:hover .back{background:linear-gradient(140deg,rgba(255,255,255,.42),rgba(255,206,226,.22))}

  background:#fbf8f2;box-shadow:0 2px 3px #0002,0 10px 22px #0001;transition:opacity .3s}
.strip::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:12px;background:linear-gradient(115deg,#fff0 30%,#ffffff4d 42%,#fff0 52%),linear-gradient(#fff3,#fff0 35%)}
.strip .lab{background:var(--c);color:#fff;font:600 12px/1.25 "PingFang SC";border-radius:7px;padding:8px 6px;writing-mode:vertical-rl;letter-spacing:2px;align-self:stretch;text-align:center}
.strip .row{display:grid;grid-template-columns:repeat(var(--cols,99),auto);gap:2px}
.strip.v{flex-direction:column;padding:8px 8px 10px}
.strip.v .lab{writing-mode:horizontal-tb;align-self:stretch;padding:6px 10px;letter-spacing:1px}
.strip.v .row{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.stkw.refill .stk{animation:refill .45s ease-out}

.stkw{position:relative;display:block;width:58px;height:58px}
.stk{width:100%;height:100%;display:block;touch-action:none;cursor:grab;transition:transform .15s;-webkit-user-drag:none}

.stkw.holo::after{content:"";position:absolute;inset:0;pointer-events:none;-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat;

.stkw.used .stk{opacity:0;pointer-events:none}
.stkw.used::before{content:"";position:absolute;inset:0;background:#e9e1d3;-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat;
  filter:drop-shadow(0 0 .5px #b9ab95)}
.stkw.used::after{display:none}
#pull{position:fixed;inset:0;width:100vw;height:100vh;z-index:29;pointer-events:none}

#peel{position:fixed;z-index:30;pointer-events:none}

.strip.one.wm{padding:3px 4px 3px 4px;gap:4px}

.strip.one.wm .row{gap:0}

.strip.one .stk{transform-origin:50% 0;transition:transform .18s cubic-bezier(.3,1.5,.5,1),filter .18s}

#drag{position:fixed;z-index:30;pointer-events:none;width:84px;height:84px;filter:drop-shadow(0 14px 10px #0004);animation:peel .35s ease-out forwards}
@keyframes peel{0%{transform:translate(-50%,-50%) perspective(300px) rotateX(0) scale(.7)}60%{transform:translate(-50%,-50%) perspective(300px) rotateX(38deg) rotateZ(-8deg) scale(1.05)}100%{transform:translate(-50%,-50%) perspective(300px) rotateX(12deg) rotateZ(-4deg) scale(1)}}
#toast{position:fixed;left:50%;top:44px;transform:translateX(-50%);z-index:40;background:#3b2414;color:#f6e7d2;border-radius:22px;padding:8px 10px 8px 18px;
  font-size:13px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 24px #0004}
#toast[hidden]{display:none}
#toast button{border:0;border-radius:14px;padding:5px 12px;background:#f6e7d2;color:#3b2414;font-size:12px;cursor:pointer}
#toast #tx{background:transparent;color:#f6e7d2;font-size:16px;padding:0 6px}
