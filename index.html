.stkw.used .stk{opacity:0;pointer-events:none}
.stkw.used::before{content:"";position:absolute;inset:0;background:#e9e1d3;-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat;

.stkw.used::after{display:none}
#peel{position:fixed;z-index:30;pointer-events:none}
.strip .stkw:not(.used) .stk:hover{transform:scale(1.06) rotate(-3deg)}

#drag{position:fixed;z-index:30;pointer-events:none;width:84px;height:84px;filter:drop-shadow(0 14px 10px #0004);animation:peel .35s ease-out forwards}
@keyframes peel{0%{transform:translate(-50%,-50%) perspective(300px) rotateX(0) scale(.7)}60%{transform:translate(-50%,-50%) perspective(300px) rotateX(38deg) rotateZ(-8deg) scale(1.05)}100%{transform:translate(-50%,-50%) perspective(300px) rotateX(12deg) rotateZ(-4deg) scale(1)}}

{const env=new RoomEnvironment();const sb=new THREE.MeshBasicMaterial({color:0xffffff});sb.color.multiplyScalar(6);

  g.fillStyle=gr;g.beginPath();g.arc(40,y,22,0,7);g.fill();g.strokeStyle='rgba(255,255,255,.7)';g.lineWidth=1.5;g.beginPath();g.arc(40,y,23,.3,2.2);g.stroke()})}

  const days=new Date(2027,month+1,0).getDate(),mm=String(month+1).padStart(2,'0');

  g.fillRect(300,110,4,210);g.font=`600 54px ${F}`;g.fillText(MONTHS[month],330,170);
  g.font=`500 36px ${F}`;g.fillText(`${mm}/01`,330,250);g.fillText(`${mm}/${days}`,330,305);
  g.strokeStyle='#2f63a8';g.lineWidth=4;g.beginPath();g.arc(910,250,40,0,7);g.stroke();g.fillStyle='#2f63a8';g.font=`600 36px ${F}`;g.textAlign='center';g.fillText(month+1,910,263);
  // watercolor-ish cat at desk
  loadIllus(month);if(illus[month]){const im=illus[month],bw=760,bh=760*im.height/im.width;g.globalCompositeOperation='multiply';g.drawImage(im,(CW-bw)/2+20,440,bw,Math.min(bh,720));g.globalCompositeOperation='source-over'}else{
  const hue=['#e9a04a','#8f9aa6','#c98a5a','#d9b48a'][month%4];

  g.fillStyle='#4fa59a';g.fillRect(-240,110,480,46);g.strokeStyle='#333';g.lineWidth=7;g.beginPath();g.moveTo(-200,156);g.lineTo(-200,240);g.moveTo(200,156);g.lineTo(200,240);g.stroke();
  g.fillStyle=hue;g.lineWidth=8;g.beginPath();g.moveTo(-110,110);g.quadraticCurveTo(-130,-160,0,-175);g.quadraticCurveTo(130,-160,110,110);g.closePath();g.fill();g.stroke();
  [[-1],[1]].forEach(([s])=>{g.beginPath();g.moveTo(s*70,-140);g.lineTo(s*95,-230);g.lineTo(s*20,-170);g.fill();g.stroke()});
  g.fillStyle='#d2453a';g.save();g.rotate(-.06);g.fillRect(-105,-185,210,26);g.restore();
  g.fillStyle='#222';g.beginPath();g.arc(-42,-95,10,0,7);g.arc(42,-95,10,0,7);g.fill();
  g.beginPath();g.moveTo(-14,-60);g.quadraticCurveTo(0,-45,14,-60);g.stroke();
  g.strokeStyle=hue;g.lineWidth=30;g.lineCap='round';g.beginPath();g.moveTo(100,60);g.quadraticCurveTo(220,40,200,-90);g.stroke();
  g.fillStyle='#a8cde0';g.strokeStyle='#333';g.lineWidth=7;g.beginPath();g.arc(230,-300,70,0,7);g.fill();g.stroke();
  g.beginPath();g.moveTo(230,-340);g.lineTo(230,-300);g.lineTo(262,-280);g.stroke();g.restore();
  }
  g.fillStyle='#231a14';g.font=`700 92px Georgia,serif`;g.textAlign='center';g.fillText('#'+MONTHS[month],CW/2+20,1270);
  g.font=`500 24px ${F}`;g.textAlign='left';g.fillText('A6  WEEKLY | MONTHLY',100,1380);g.textAlign='right';g.fillText('▸▸▸',950,1380);g.textAlign='left';
  tIntro.needsUpdate=true}
let EDITK=null;
const NOTES=load('pn27-notes',{}),STK=load('pn27-stickers',[]);let CELLS=[];
function load(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}}
function save(){try{localStorage.setItem('pn27-notes',JSON.stringify(NOTES));localStorage.setItem('pn27-stickers',JSON.stringify(STK))}catch(e){}}
const HAND='"Kaiti SC","STKaiti","Bradley Hand","Marker Felt",cursive';
function hand(g,txt,x,y,maxW,seed){g.save();g.fillStyle='#24324f';g.font=`30px ${HAND}`;
  let line='',ly=y,i=0;const lines=[];for(const ch of txt){if(ch=='\n'||g.measureText(line+ch).width>maxW){lines.push(line);line=ch=='\n'?'':ch}else line+=ch}lines.push(line);

function drawGrid(c,cols,isRight){const g=c.getContext('2d');paperBase(g);
  const days=new Date(2027,month+1,0).getDate(),first=(new Date(2027,month,1).getDay()+6)%7,rows=Math.ceil((first+days)/7);

  g.strokeStyle='#333';g.lineWidth=4;g.beginPath();g.moveTo(x0,y0);g.lineTo(x1,y0);g.moveTo(x0,y1);g.lineTo(x1,y1);
  isRight?(g.moveTo(x1,y0),g.lineTo(x1,y1)):(g.moveTo(x0,y0),g.lineTo(x0,y1));g.stroke();
  if(isRight){g.fillStyle='#2f63a8';g.fillRect(CW-70,0,70,CH);const th=CH/12;
    for(let i=0;i<12;i++){if(i==month){g.fillStyle='#fbf9f4';g.fillRect(CW-70,i*th,70,th)}
      g.fillStyle=i==month?'#2f63a8':'#fff';g.font=`600 28px ${F}`;g.textAlign='center';g.fillText(i+1,CW-35,i*th+th/2+10);
      g.strokeStyle='#ffffff55';g.beginPath();g.moveTo(CW-70,i*th);g.lineTo(CW,i*th);g.stroke()}g.textAlign='left'}
  else{g.fillStyle='#999';g.font=`22px ${F}`;g.fillText('● 新月   ◐ 上弦   ○ 满月   ◑ 下弦',60,CH-60)}}

  if(left){const gr=g.createLinearGradient(0,0,60,0);gr.addColorStop(0,'rgba(90,70,50,.18)');gr.addColorStop(1,'rgba(90,70,50,0)');g.fillStyle=gr;g.fillRect(0,0,60,CH)}

const illus={};

  stepFlip(dt);updLeft();if(STK.some(p=>p.t&&Date.now()-p.t<560))drawAll();
  controls.update();placeInk();placeStrips();renderer.render(scene,camera);requestAnimationFrame(frame)}
window.NB={cur,state,log:SFX_LOG,renderAudio,
  cellXY(d,side){const c=CELLS.find(k=>k.d==d&&k.c!==cvIntro);if(!c)return null;return toScreen(cellWorld(c,c.c===cvL?s2.front:s3.front,.5,.62))},
  charmXY(){const v=new THREE.Vector3();mouse.getWorldPosition(v);v.y-=3.2;return toScreen(v)},coverXY(){return toScreen(coverMesh.localToWorld(new THREE.Vector3(1.5,-2,0)))}};
frame();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
